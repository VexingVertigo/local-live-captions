<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 14px 16px;
      background: #141417;
      color: #e4e4e7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      user-select: none;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #27272a;
    }

    .title {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.5px;
      color: #fafafa;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #a1a1aa;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #71717a;
    }

    .status-dot.connected {
      background: #22c55e;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.4);
    }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #71717a;
      margin: 12px 0 8px 0;
      font-weight: 700;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .label-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .label {
      color: #d4d4d8;
      font-size: 12px;
    }

    /* Subtle amber pill tag */
    .badge-exp {
      background: rgba(245, 158, 11, 0.15);
      color: #f59e0b;
      border: 1px solid rgba(245, 158, 11, 0.35);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.4px;
      padding: 1px 5px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    /* Switch styling */
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider-toggle {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #27272a;
      transition: .2s;
      border-radius: 20px;
    }

    .slider-toggle:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: #ffffff;
      transition: .2s;
      border-radius: 50%;
    }

    input:checked + .slider-toggle {
      background-color: #3b82f6;
    }

    input:checked + .slider-toggle:before {
      transform: translateX(16px);
    }

    /* Color input styling */
    input[type="color"] {
      -webkit-appearance: none;
      border: 1px solid #3f3f46;
      border-radius: 4px;
      width: 32px;
      height: 22px;
      cursor: pointer;
      background: none;
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: none;
      border-radius: 3px;
    }

    /* Range slider styling */
    .range-group {
      margin-bottom: 10px;
    }

    .range-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 12px;
      color: #d4d4d8;
    }

    input[type="range"] {
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: #27272a;
      outline: none;
      accent-color: #3b82f6;
      cursor: pointer;
    }

    .footer {
      margin-top: 14px;
      padding-top: 8px;
      border-top: 1px solid #27272a;
      text-align: center;
      font-size: 11px;
      color: #71717a;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">AI CAPTIONS</span>
    <div class="status-badge">
      <div id="statusDot" class="status-dot"></div>
      <span id="statusText">Connecting...</span>
    </div>
  </div>

  <div class="section-title">Speaker Diarization</div>
  <div class="control-row">
    <div class="label-group">
      <span class="label">Multi-Speaker Colors</span>
      <span class="badge-exp">Beta</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="speakerColorsToggle">
      <span class="slider-toggle"></span>
    </label>
  </div>

  <div class="section-title">Caption Styling</div>
  <div class="control-row">
    <span class="label">Default Text Color</span>
    <input type="color" id="textColorPicker" value="#ffffff">
  </div>

  <div class="control-row">
    <span class="label">Show Background Box</span>
    <label class="switch">
      <input type="checkbox" id="showBgToggle" checked>
      <span class="slider-toggle"></span>
    </label>
  </div>

  <div class="range-group">
    <div class="range-header">
      <span>Background Opacity</span>
      <span id="opacityVal">85%</span>
    </div>
    <input type="range" id="opacityRange" min="0" max="100" value="85">
  </div>

  <div class="footer">
    Toggle overlay on video: <b>Alt + C</b>
  </div>

  <script src="popup.js"></script>
</body>
</html>
