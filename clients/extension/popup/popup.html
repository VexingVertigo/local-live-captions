<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    /* Gecko needs dimensions on html and body to prevent popup collapse */
    html, body {
      width: 250px;
      min-height: 140px;
      margin: 0;
      padding: 0;
      background: #18181b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    .container {
      padding: 14px;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #a1a1aa;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #71717a;
      box-shadow: 0 0 6px rgba(0,0,0,0.5);
    }
    .dot.online {
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }
    .dot.offline {
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }
    .card {
      background: #27272a;
      border-radius: 6px;
      padding: 10px;
      font-size: 12px;
      line-height: 1.4;
      color: #d4d4d8;
      border: 1px solid #3f3f46;
    }
    .hotkey {
      margin-top: 10px;
      font-size: 11px;
      color: #a1a1aa;
      text-align: center;
    }
    kbd {
      background: #3f3f46;
      padding: 2px 5px;
      border-radius: 3px;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="title">AI Captions</span>
      <div class="status-badge">
        <div id="status-dot" class="dot"></div>
        <span id="status-text">Checking...</span>
      </div>
    </div>

    <div class="card" id="status-detail">
      Connecting to local engine...
    </div>

    <div class="hotkey">
      Toggle on video: <kbd>Alt</kbd> + <kbd>C</kbd>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
